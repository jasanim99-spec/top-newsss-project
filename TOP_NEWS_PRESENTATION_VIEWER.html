<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TOP NEWS — Final Project Presentation (P P Savani University)</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }
        body {
            background-color: #0b1120;
            color: #f8fafc;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            overflow: hidden;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Top Nav Bar */
        header {
            height: 52px;
            background: #0f172a;
            border-bottom: 1px solid #1e293b;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
            z-index: 50;
        }
        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
            font-weight: 700;
            font-size: 15px;
            color: #f8fafc;
            letter-spacing: 0.5px;
        }
        .badge {
            background: #1e3a8a;
            color: #60a5fa;
            font-size: 11px;
            padding: 3px 8px;
            border-radius: 6px;
            font-weight: 600;
            border: 1px solid #2563eb;
        }
        .controls {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        button {
            background: #1e293b;
            color: #f8fafc;
            border: 1px solid #334155;
            padding: 6px 14px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 500;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            transition: all 0.15s ease;
        }
        button:hover {
            background: #334155;
            border-color: #475569;
        }
        button.primary {
            background: #2563eb;
            border-color: #1d4ed8;
        }
        button.primary:hover {
            background: #1d4ed8;
        }
        .slide-counter {
            font-size: 13px;
            color: #94a3b8;
            font-weight: 600;
            min-width: 90px;
            text-align: center;
        }

        /* Main Stage */
        main {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            background: #090d16;
            padding: 16px;
        }
        .slide-container {
            max-width: 100%;
            max-height: 100%;
            aspect-ratio: 16 / 9;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
            border-radius: 8px;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #fff;
            position: relative;
        }
        .slide-img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: none;
        }
        .slide-img.active {
            display: block;
            animation: fadeIn 0.2s ease-in-out;
        }
        @keyframes fadeIn {
            from { opacity: 0.8; transform: scale(0.995); }
            to { opacity: 1; transform: scale(1); }
        }

        /* Side Navigation Arrows */
        .nav-btn {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: rgba(15, 23, 42, 0.75);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 20px;
            z-index: 40;
            backdrop-filter: blur(8px);
        }
        .nav-btn:hover {
            background: rgba(37, 99, 235, 0.9);
            border-color: #2563eb;
            transform: translateY(-50%) scale(1.08);
        }
        .nav-prev { left: 24px; }
        .nav-next { right: 24px; }

        /* Bottom Thumbnail Strip */
        footer {
            height: 85px;
            background: #0f172a;
            border-top: 1px solid #1e293b;
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 8px 16px;
            overflow-x: auto;
            scroll-behavior: smooth;
        }
        footer::-webkit-scrollbar {
            height: 6px;
        }
        footer::-webkit-scrollbar-thumb {
            background: #334155;
            border-radius: 3px;
        }
        .thumb {
            height: 65px;
            aspect-ratio: 16 / 9;
            border-radius: 4px;
            border: 2px solid transparent;
            cursor: pointer;
            overflow: hidden;
            flex-shrink: 0;
            position: relative;
            transition: all 0.2s;
            opacity: 0.6;
        }
        .thumb:hover {
            opacity: 0.9;
            transform: translateY(-2px);
        }
        .thumb.active {
            border-color: #3b82f6;
            opacity: 1;
            box-shadow: 0 0 10px rgba(59, 130, 246, 0.6);
        }
        .thumb img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .thumb-num {
            position: absolute;
            bottom: 2px;
            left: 2px;
            background: rgba(0,0,0,0.7);
            color: #fff;
            font-size: 9px;
            font-weight: 700;
            padding: 1px 4px;
            border-radius: 2px;
        }

        /* Print Media */
        @media print {
            header, footer, .nav-btn {
                display: none !important;
            }
            body, main {
                background: #fff;
                padding: 0;
                height: auto;
                overflow: visible;
            }
            .slide-container {
                box-shadow: none;
                border-radius: 0;
                width: 100%;
                height: 100vh;
                page-break-after: always;
            }
            .slide-img {
                display: block !important;
            }
        }
    </style>
</head>
<body>

    <header>
        <div class="brand">
            <span>TOP NEWS</span>
            <span class="badge">PPSU Presentation</span>
            <span style="font-size: 13px; color: #94a3b8; font-weight: normal;">Jasani Meet (23SE02ML077)</span>
        </div>
        <div class="controls">
            <span class="slide-counter" id="slideIndicator">Slide 1 / 14</span>
            <button onclick="prevSlide()">◀ Previous</button>
            <button class="primary" onclick="nextSlide()">Next ▶</button>
            <button onclick="toggleFullscreen()">⛶ Fullscreen</button>
            <button onclick="window.print()">🖶 Print / PDF</button>
        </div>
    </header>

    <main>
        <div class="nav-btn nav-prev" onclick="prevSlide()" title="Previous slide (Left Arrow)">❮</div>
        
        <div class="slide-container" id="presentationContainer">
            <img src="presentation_slides_png/slide_01.png" class="slide-img active" id="slide_0" alt="Slide 1">
            <img src="presentation_slides_png/slide_02.png" class="slide-img " id="slide_1" alt="Slide 2">
            <img src="presentation_slides_png/slide_03.png" class="slide-img " id="slide_2" alt="Slide 3">
            <img src="presentation_slides_png/slide_04.png" class="slide-img " id="slide_3" alt="Slide 4">
            <img src="presentation_slides_png/slide_05.png" class="slide-img " id="slide_4" alt="Slide 5">
            <img src="presentation_slides_png/slide_06.png" class="slide-img " id="slide_5" alt="Slide 6">
            <img src="presentation_slides_png/slide_07.png" class="slide-img " id="slide_6" alt="Slide 7">
            <img src="presentation_slides_png/slide_08.png" class="slide-img " id="slide_7" alt="Slide 8">
            <img src="presentation_slides_png/slide_09.png" class="slide-img " id="slide_8" alt="Slide 9">
            <img src="presentation_slides_png/slide_10.png" class="slide-img " id="slide_9" alt="Slide 10">
            <img src="presentation_slides_png/slide_11.png" class="slide-img " id="slide_10" alt="Slide 11">
            <img src="presentation_slides_png/slide_12.png" class="slide-img " id="slide_11" alt="Slide 12">
            <img src="presentation_slides_png/slide_13.png" class="slide-img " id="slide_12" alt="Slide 13">
            <img src="presentation_slides_png/slide_14.png" class="slide-img " id="slide_13" alt="Slide 14">
        </div>

        <div class="nav-btn nav-next" onclick="nextSlide()" title="Next slide (Right Arrow / Space)">❯</div>
    </main>

    <footer id="thumbBar">
        <div class="thumb active" id="thumb_0" onclick="goToSlide(0)" title="1. Title & Candidate Particulars">
            <img src="presentation_slides_png/slide_01.png" alt="Thumb 1">
            <span class="thumb-num">1</span>
        </div>
        <div class="thumb " id="thumb_1" onclick="goToSlide(1)" title="2. Introduction & Overview">
            <img src="presentation_slides_png/slide_02.png" alt="Thumb 2">
            <span class="thumb-num">2</span>
        </div>
        <div class="thumb " id="thumb_2" onclick="goToSlide(2)" title="3. Problem Statement & Industry Benchmarks">
            <img src="presentation_slides_png/slide_03.png" alt="Thumb 3">
            <span class="thumb-num">3</span>
        </div>
        <div class="thumb " id="thumb_3" onclick="goToSlide(3)" title="4. Project Objectives (6 Core Goals)">
            <img src="presentation_slides_png/slide_04.png" alt="Thumb 4">
            <span class="thumb-num">4</span>
        </div>
        <div class="thumb " id="thumb_4" onclick="goToSlide(4)" title="5. Technology Stack & 3-Tier Architecture">
            <img src="presentation_slides_png/slide_05.png" alt="Thumb 5">
            <span class="thumb-num">5</span>
        </div>
        <div class="thumb " id="thumb_5" onclick="goToSlide(5)" title="6. Editorial & Publishing Process Workflow">
            <img src="presentation_slides_png/slide_06.png" alt="Thumb 6">
            <span class="thumb-num">6</span>
        </div>
        <div class="thumb " id="thumb_6" onclick="goToSlide(6)" title="7. System Analysis & Database Design">
            <img src="presentation_slides_png/slide_07.png" alt="Thumb 7">
            <span class="thumb-num">7</span>
        </div>
        <div class="thumb " id="thumb_7" onclick="goToSlide(7)" title="8. System in Action: Consumer Portal & Reels">
            <img src="presentation_slides_png/slide_08.png" alt="Thumb 8">
            <span class="thumb-num">8</span>
        </div>
        <div class="thumb " id="thumb_8" onclick="goToSlide(8)" title="9. System in Action: Newsroom Governance & Press Card">
            <img src="presentation_slides_png/slide_09.png" alt="Thumb 9">
            <span class="thumb-num">9</span>
        </div>
        <div class="thumb " id="thumb_9" onclick="goToSlide(9)" title="10. Results, Testing & Verification Benchmarks">
            <img src="presentation_slides_png/slide_10.png" alt="Thumb 10">
            <span class="thumb-num">10</span>
        </div>
        <div class="thumb " id="thumb_10" onclick="goToSlide(10)" title="11. Launched & Operational (Live Deployment & QR)">
            <img src="presentation_slides_png/slide_11.png" alt="Thumb 11">
            <span class="thumb-num">11</span>
        </div>
        <div class="thumb " id="thumb_11" onclick="goToSlide(11)" title="12. Engineering Challenges & Solutions">
            <img src="presentation_slides_png/slide_12.png" alt="Thumb 12">
            <span class="thumb-num">12</span>
        </div>
        <div class="thumb " id="thumb_12" onclick="goToSlide(12)" title="13. Future Scope & Roadmap">
            <img src="presentation_slides_png/slide_13.png" alt="Thumb 13">
            <span class="thumb-num">13</span>
        </div>
        <div class="thumb " id="thumb_13" onclick="goToSlide(13)" title="14. Conclusion, Repository & Discussion">
            <img src="presentation_slides_png/slide_14.png" alt="Thumb 14">
            <span class="thumb-num">14</span>
        </div>
    </footer>

    <script>
        let currentSlide = 0;
        const totalSlides = 14;

        function updateSlideUI() {
            document.querySelectorAll('.slide-img').forEach((img, i) => {
                img.classList.toggle('active', i === currentSlide);
            });
            document.querySelectorAll('.thumb').forEach((thumb, i) => {
                thumb.classList.toggle('active', i === currentSlide);
            });
            document.getElementById('slideIndicator').innerText = `Slide ${currentSlide + 1} / ${totalSlides}`;

            // Scroll active thumbnail into view
            const activeThumb = document.getElementById(`thumb_${currentSlide}`);
            if (activeThumb) {
                activeThumb.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });
            }
        }

        function nextSlide() {
            if (currentSlide < totalSlides - 1) {
                currentSlide++;
                updateSlideUI();
            }
        }

        function prevSlide() {
            if (currentSlide > 0) {
                currentSlide--;
                updateSlideUI();
            }
        }

        function goToSlide(idx) {
            if (idx >= 0 && idx < totalSlides) {
                currentSlide = idx;
                updateSlideUI();
            }
        }

        function toggleFullscreen() {
            const el = document.documentElement;
            if (!document.fullscreenElement) {
                el.requestFullscreen().catch(err => {
                    alert(`Error attempting fullscreen: ${err.message}`);
                });
            } else {
                document.exitFullscreen();
            }
        }

        // Keyboard navigation
        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowRight' || e.key === 'Space' || e.key === 'PageDown') {
                e.preventDefault();
                nextSlide();
            } else if (e.key === 'ArrowLeft' || e.key === 'PageUp') {
                e.preventDefault();
                prevSlide();
            } else if (e.key === 'Home') {
                e.preventDefault();
                goToSlide(0);
            } else if (e.key === 'End') {
                e.preventDefault();
                goToSlide(totalSlides - 1);
            } else if (e.key.toLowerCase() === 'f') {
                toggleFullscreen();
            }
        });
    </script>
</body>
</html>
